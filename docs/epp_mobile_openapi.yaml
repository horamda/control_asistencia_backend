  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Item": {
        "type": "object",
        "required": [
          "articulo_id",
          "talle",
          "cantidad"
        ],
        "properties": {
          "articulo_id": {
            "type": "integer",
            "minimum": 1
          },
          "talle": {
            "type": "string",
            "maxLength": 80
          },
          "cantidad": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000
          },
          "medidas": {
            "type": "string",
            "maxLength": 300
          }
        }
      },
      "Size": {
        "type": "object",
        "required": [
          "articulo_id"
        ],
        "properties": {
          "articulo_id": {
            "type": "integer",
            "minimum": 1
          },
          "talle": {
            "type": "string",
            "maxLength": 80
          },
          "medidas": {
            "type": "string",
            "maxLength": 300
          },
          "eliminar": {
            "type": "boolean"
          }
        },
        "description": "Talle requerido salvo eliminar=true."
      },
      "Cancel": {
        "type": "object",
        "required": [
          "accion",
          "revision",
          "motivo"
        ],
        "properties": {
          "accion": {
            "type": "string",
            "enum": [
              "cancelar"
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "motivo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          }
        }
      },
      "Order": {
        "type": "object",
        "required": [
          "envio_id",
          "motivo",
          "items"
        ],
        "properties": {
          "motivo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "envio_id": {
            "type": "string",
            "format": "uuid"
          },
          "accion": {
            "type": "string",
            "enum": [
              "borrador",
              "enviar"
            ],
            "default": "enviar"
          }
        }
      },
      "Edit": {
        "type": "object",
        "required": [
          "revision",
          "motivo",
          "items"
        ],
        "properties": {
          "motivo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "accion": {
            "type": "string",
            "enum": [
              "borrador",
              "enviar"
            ],
            "default": "enviar"
          }
        }
      },
      "Article": {
        "type": "object",
        "required": [
          "id",
          "nombre",
          "categoria",
          "talles",
          "tiene_imagen"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "nombre": {
            "type": "string"
          },
          "categoria": {
            "type": "string"
          },
          "descripcion": {
            "type": "string"
          },
          "activo": {
            "type": "integer"
          },
          "tiene_imagen": {
            "type": "integer"
          },
          "aviso_anual": {
            "type": "integer"
          },
          "talles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "sectores": {
            "type": "array",
            "items": {
              "type": "integer"
            }
          },
          "puestos": {
            "type": "array",
            "items": {
              "type": "integer"
            }
          }
        }
      },
      "SavedSize": {
        "type": "object",
        "properties": {
          "articulo_id": {
            "type": "integer"
          },
          "talle": {
            "type": "string"
          },
          "medidas": {
            "type": "string"
          },
          "actualizado_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Line": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "articulo_id": {
            "type": "integer"
          },
          "nombre": {
            "type": "string"
          },
          "categoria": {
            "type": "string"
          },
          "talle": {
            "type": "string"
          },
          "medidas": {
            "type": "string"
          },
          "cantidad": {
            "type": "integer"
          },
          "aprobada": {
            "type": "integer",
            "nullable": true
          },
          "entregada": {
            "type": "integer"
          },
          "entregado_anio": {
            "type": "integer"
          },
          "aviso_anual": {
            "type": "integer"
          },
          "motivo": {
            "type": "string"
          }
        }
      },
      "Delivery": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "fecha": {
            "type": "string",
            "format": "date"
          },
          "responsable_id": {
            "type": "integer"
          },
          "observaciones": {
            "type": "string"
          },
          "anulada": {
            "type": "integer"
          },
          "firmada": {
            "type": "integer"
          }
        }
      },
      "OrderDetail": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "revision": {
            "type": "integer"
          },
          "empleado_id": {
            "type": "integer"
          },
          "empresa_id": {
            "type": "integer"
          },
          "sucursal_id": {
            "type": "integer"
          },
          "empleado_nombre": {
            "type": "string"
          },
          "legajo": {
            "type": "string"
          },
          "estado": {
            "type": "string",
            "enum": [
              "borrador",
              "pendiente",
              "aprobado",
              "parcial",
              "entregado",
              "rechazado",
              "cancelado"
            ]
          },
          "motivo": {
            "type": "string"
          },
          "creado_at": {
            "type": "string",
            "format": "date-time"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Line"
            }
          },
          "entregas": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Delivery"
            }
          },
          "historial": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        }
      }
    }
