      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adjunto_id
          in: path
          required: true
          schema:
            type: integer
        - name: download
          in: query
          schema:
            type: boolean
          description: Si es true, fuerza descarga como attachment.
      responses:
        '200':
          description: Archivo adjunto
          content:
