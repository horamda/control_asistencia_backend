openapi: 3.0.3
info:
  title: FichaYa - API empleados Web y Flutter v1
  version: 1.35.0
  description: |
    API REST compartida para frontend web de empleados, Flutter web y Flutter nativo.
    Version 1.35.0: viáticos mensuales por sector, kilómetros informativos, odómetro opcional, cierre y reaperturas, comprobantes y avisos del día 5. Nuevas altas requieren período. Ver reintegros_mobile.md.
    Version 1.34.1: selección múltiple de externos en Seguridad e Higiene y contrato de Viáticos y reintegros. Actualización documental.
    Version 1.34.0: reintegros ARS con gastos y fotos; guia docs/reintegros_mobile.md.
    Version 1.33.2: resumen propio, indicadores y rankings de Seguridad e Higiene; guia en docs/seguridad_mobile_dashboard.md. Rutas anteriores compatibles.
    Los endpoints de API (excepto POST /auth/login y GET /version) requieren header `Authorization: Bearer <token>`.
    Las rutas de foto de perfil por DNI son publicas.
    Los modulos complementarios Feedback (`/api/v1/feedback`) y SKAP (`/api/skap`)
    usan el mismo Bearer JWT mobile, aunque no cuelgan del prefijo `/api/v1/mobile`.
    La campana de Alertas del home agrupa adelantos, pedidos de mercaderia y feedback
    para mostrar novedades o aprobaciones pendientes sin cambiar los flujos existentes.
  contact:
    name: Equipo Backend
servers:
  - url: http://localhost:5000/api/v1/mobile
    description: Local
  - url: https://control-asistencia.up.railway.app/api/v1/mobile
    description: Produccion

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SeguridadRankingPersona:
      type: object
      required: [empleado_id, nombre, legajo, cantidad, posicion]
      properties:
        empleado_id: {type: integer}
        nombre: {type: string}
        legajo: {type: string}
        cantidad: {type: integer, minimum: 1}
        posicion: {type: integer, minimum: 1}
    SeguridadRankingPropio:
      type: object
      nullable: true
      required: [empleado_id, nombre, legajo, cantidad, posicion]
      properties:
        empleado_id: {type: integer}
        nombre: {type: string}
        legajo: {type: string}
        cantidad: {type: integer, minimum: 1}
        posicion: {type: integer, minimum: 1}
    SeguridadRankingExterno:
      type: object
      required: [externo_id, nombre, empresa, cantidad, posicion]
      properties:
        externo_id: {type: integer}
        nombre: {type: string}
        empresa: {type: string}
        cantidad: {type: integer, minimum: 1}
        posicion: {type: integer, minimum: 1}
    SeguridadRanking:
      type: object
      required: [anio, mes, alcance, sucursal_id, rankings, rankings_externos, eventos, mi_posicion]
      properties:
        anio: {type: integer}
        mes: {type: integer, nullable: true}
        alcance: {type: string, enum: [empresa, sucursal]}
        sucursal_id: {type: integer, nullable: true}
        rankings:
          type: object
          required: [seguro, inseguro]
          properties:
            seguro: {type: array, items: {$ref: '#/components/schemas/SeguridadRankingPersona'}}
            inseguro: {type: array, items: {$ref: '#/components/schemas/SeguridadRankingPersona'}}
        rankings_externos:
          type: object
          required: [seguro, inseguro]
          properties:
            seguro: {type: array, items: {$ref: '#/components/schemas/SeguridadRankingExterno'}}
            inseguro: {type: array, items: {$ref: '#/components/schemas/SeguridadRankingExterno'}}
        eventos:
          type: array
          items:
            type: object
            required: [tipo, cantidad]
            properties:
              tipo: {type: string, enum: [seguro, inseguro]}
              cantidad: {type: integer, minimum: 0}
        mi_posicion:
          type: object
          required: [seguro, inseguro]
          properties:
            seguro: {$ref: '#/components/schemas/SeguridadRankingPropio'}
            inseguro: {$ref: '#/components/schemas/SeguridadRankingPropio'}
    SeguridadConteos:
      type: object
      required: [seguro, inseguro, accidente, incidente]
      properties:
        seguro: {type: integer, minimum: 0}
        inseguro: {type: integer, minimum: 0}
        accidente: {type: integer, minimum: 0}
        incidente: {type: integer, minimum: 0}
    SeguridadMeses:
      type: array
      minItems: 12
      maxItems: 12
      description: Enero a diciembre; cero sin reportes aprobados, null mes futuro. Mes actual parcial.
      items: {type: integer, minimum: 0, nullable: true}
    SeguridadSerieAnual:
      type: object
      required: [anio, valores]
      properties:
        anio: {type: integer}
        valores: {$ref: '#/components/schemas/SeguridadMeses'}
    SeguridadIndicador:
      type: object
      required: [disponible, motivo, inicio, dias_sin_accidentes, record_dias_sin_accidentes, ultimo_accidente, accidentes_registrados]
      properties:
        disponible: {type: boolean}
        motivo: {type: string, nullable: true, enum: [sin_inicio_configurado, sin_sucursal, corte_anterior_al_inicio, null]}
        inicio: {type: string, format: date, nullable: true}
        dias_sin_accidentes: {type: integer, minimum: 0, nullable: true}
        record_dias_sin_accidentes: {type: integer, minimum: 0, nullable: true}
        ultimo_accidente: {type: string, format: date, nullable: true}
        accidentes_registrados: {type: integer, minimum: 0, nullable: true}
    SeguridadIndicadores:
      type: object
      required: [hasta, sucursal_id, alcances, criterio]
      properties:
        hasta: {type: string, format: date}
        sucursal_id: {type: integer, nullable: true}
        criterio: {type: string}
        alcances:
          type: object
          required: [empresa, sucursal, propio]
          properties:
            empresa: {$ref: '#/components/schemas/SeguridadIndicador'}
            sucursal: {$ref: '#/components/schemas/SeguridadIndicador'}
            propio: {$ref: '#/components/schemas/SeguridadIndicador'}
    SeguridadResumen:
      type: object
      required: [anio, mes, fecha_corte, estado, total, por_tipo, meses, comparativo_anual, series_mensuales, indicadores, actualizado_at]
      properties:
        anio: {type: integer}
        mes: {type: integer, nullable: true, minimum: 1, maximum: 12}
        fecha_corte: {type: string, format: date}
        estado: {type: string, enum: [aprobado]}
        total: {type: integer, minimum: 0}
        por_tipo: {$ref: '#/components/schemas/SeguridadConteos'}
        meses: {type: array, minItems: 12, maxItems: 12, items: {type: integer, minimum: 1, maximum: 12}}
        comparativo_anual:
          type: object
          required: [seguro, inseguro, accidente, incidente]
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/SeguridadSerieAnual'}
        series_mensuales:
          type: object
          required: [seguro, inseguro, accidente, incidente]
          additionalProperties: {$ref: '#/components/schemas/SeguridadMeses'}
        indicadores: {$ref: '#/components/schemas/SeguridadIndicadores'}
        actualizado_at: {type: string, format: date-time}
    AppVersionResponse:
      type: object
      properties:
        ok:
          type: boolean
        platform:
          type: string
          enum:
          - android
          - ios
        version_minima:
          type: string
        version_recomendada:
          type: string
        url_descarga:
          type: string
          nullable: true
        mensaje:
          type: string
          nullable: true
    LegajoHistorialPorTipoResponse:
      type: object
      properties:
        ok:
          type: boolean
        total_tipos:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              tipo_id:
                type: integer
              codigo:
                type: string
              nombre:
                type: string
              total:
                type: integer
              vigentes:
                type: integer
              ultima_fecha:
                type: string
                format: date
                nullable: true
    KpisSectorDiaResponse:
      type: object
      properties:
        fecha:
          type: string
        sector:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            nombre:
              type: string
              nullable: true
        kpis:
          type: array
          items:
            type: object
            properties:
              kpi_id:
                type: integer
              codigo:
                type: string
              nombre:
                type: string
              unidad:
                type: string
              tipo_acumulacion:
                type: string
                enum:
                - suma
                - promedio
                - ultimo
              mayor_es_mejor:
                type: boolean
              condicion:
                type: string
              condicion_simbolo:
                type: string
              objetivo_anual:
                type: number
              valor_min:
                type: number
                nullable: true
              valor_max:
                type: number
                nullable: true
              tiene_resultado:
                type: boolean
              resultado_dia:
                type: number
                nullable: true
              objetivo_dia:
                type: number
                nullable: true
              resultado_acumulado_a_fecha:
                type: number
                nullable: true
              objetivo_acumulado_a_fecha:
                type: number
                nullable: true
              progreso_dia_pct:
                type: number
              progreso_acumulado_pct:
                type: number
              semaforo_dia:
                type: string
                enum:
                - gris
                - rojo
                - amarillo
                - verde
              semaforo_acumulado:
                type: string
                enum:
                - gris
                - rojo
                - amarillo
                - verde
    PremiosResponse:
      type: object
      properties:
        anio:
          type: integer
        sector:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            nombre:
              type: string
              nullable: true
        resumen:
          type: object
          properties:
            total_premios:
              type: integer
            mejor_ranking:
              type: integer
              nullable: true
            primeros_puestos:
              type: integer
            podios:
              type: integer
        meses:
          type: array
          items:
            type: object
            properties:
              mes:
                type: integer
              nombre:
                type: string
              premios:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    periodo:
                      type: string
                    periodo_year:
                      type: integer
                    periodo_month:
                      type: integer
                    mes_nombre:
                      type: string
                    ranking:
                      type: integer
                    observaciones:
                      type: string
                      nullable: true
                    concurso:
                      type: object
                      properties:
                        id:
                          type: integer
                        codigo:
                          type: string
                        nombre:
                          type: string
                        descripcion:
                          type: string
                          nullable: true
                        alcance:
                          type: string
                        sector:
                          type: object
                          properties:
                            id:
                              type: integer
                            nombre:
                              type: string
                          nullable: true
                    sector_empleado:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
          minItems: 12
          maxItems: 12
    TriviaInfo:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        fecha_inicio:
          type: string
          nullable: true
        fecha_fin:
          type: string
          nullable: true
        estado:
          type: string
        premio:
          type: string
          nullable: true
        mensaje_ganador:
          type: string
          nullable: true
        anio:
          type: integer
          nullable: true
    TriviaPregunta:
      type: object
      properties:
        id:
          type: integer
        trivia_id:
          type: integer
        texto:
          type: string
        opcion_a:
          type: string
        opcion_b:
          type: string
        opcion_c:
          type: string
        opcion_d:
          type: string
        puntos:
          type: integer
        orden:
          type: integer
      description: Pregunta para jugar; nunca incluye respuesta_correcta.
    TriviaIniciarData:
      type: object
      properties:
        trivia_id:
          type: integer
          nullable: true
        titulo:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        fecha_fin:
          type: string
          nullable: true
        preguntas:
          type: array
          items:
            $ref: '#/components/schemas/TriviaPregunta'
    TriviaRankingItem:
      type: object
      properties:
        posicion:
          type: integer
        empleado_id:
          type: integer
        empleado_dni:
          type: string
        empleado_nombre:
          type: string
        puntos_total:
          type: integer
        correctas:
          type: integer
        incorrectas:
          type: integer
        tiempo_total_segundos:
          type: integer
        es_ganador:
          type: boolean
    TriviaHistorialItem:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
        fecha_inicio:
          type: string
        fecha_fin:
          type: string
        estado:
          type: string
        premio:
          type: string
        mensaje_ganador:
          type: string
        anio:
          type: integer
        ganador_nombre:
          type: string
          nullable: true
        ganador_dni:
          type: string
          nullable: true
        ganador_puntos:
          type: integer
          nullable: true
    TriviaHistorialPersonalItem:
      type: object
      properties:
        trivia_id:
          type: integer
        titulo:
          type: string
        estado_trivia:
          type: string
        fecha_inicio:
          type: string
        fecha_fin:
          type: string
        premio:
          type: string
        puntos_total:
          type: integer
        correctas:
          type: integer
        incorrectas:
          type: integer
        tiempo_total_segundos:
          type: integer
        posicion:
          type: integer
          nullable: true
        es_ganador:
          type: boolean
        estado_resultado:
          type: string
        fecha_inicio_participacion:
          type: string
        fecha_finalizacion:
          type: string
        fuera_ranking:
          type: boolean
          default: false
    TriviaGanador:
      type: object
      properties:
        trivia_id:
          type: integer
        titulo:
          type: string
        premio:
          type: string
        mensaje_ganador:
          type: string
        empleado_id:
          type: integer
        empleado_dni:
          type: string
        empleado_nombre:
          type: string
        puntos_total:
          type: integer
        tiempo_total_segundos:
          type: integer
        fecha_registro:
          type: string
    TriviaRankingAnualItem:
      type: object
      properties:
        id:
          type: integer
        anio:
          type: integer
        empleado_id:
          type: integer
        empleado_dni:
          type: string
        empleado_nombre:
          type: string
        puntos_anuales:
          type: integer
        trivias_participadas:
          type: integer
        trivias_ganadas:
          type: integer
        correctas_totales:
          type: integer
        incorrectas_totales:
          type: integer
        tiempo_total_anual:
          type: integer
        posicion:
          type: integer
        es_ganador_anual:
          type: boolean
    TriviaNotificacion:
      type: object
      properties:
        id:
          type: integer
        trivia_id:
          type: integer
        trivia_titulo:
          type: string
        tipo:
          type: string
          enum:
          - recordatorio_24h
          - recordatorio_2h
        mensaje:
          type: string
        enviada_en:
          type: string
        fecha_fin_trivia:
          type: string
    CalificarAppRequest:
      type: object
      properties:
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          nullable: true
        pantalla:
          type: string
          nullable: true
        version_app:
          type: string
          nullable: true
      required:
      - puntuacion
    CargaError:
      type: object
      required: [error]
      properties:
        error: {type: string, description: Mensaje legible; no hay un codigo de conflicto estable.}
      example:
        error: Este camión ya tiene una carga inicial hoy. Registre una recarga.
    CargaAltaResponse:
      type: object
      required: [registro, repetido]
      properties:
        registro: {$ref: '#/components/schemas/CargaRegistro'}
        repetido: {type: boolean, description: false con 201; true con 200 por reintento identico.}
    CargaConfig:
      type: object
      required: [habilitado, tiene_historial, fecha_servidor, zona_horaria, max_fotos, max_foto_bytes, camiones, horarios]
      properties:
        habilitado: {type: boolean, description: Permite crear; definido por puestos activos configurados en el servidor.}
        tiene_historial: {type: boolean, description: Permite mostrar el acceso al historial aunque no pueda crear.}
        fecha_servidor: {type: string, format: date-time, example: '2026-09-29T07:55:12-03:00'}
        zona_horaria: {type: string, example: America/Argentina/Buenos_Aires}
        max_fotos: {type: integer, example: 5}
        max_foto_bytes: {type: integer, example: 5242880}
        camiones:
          type: array
          description: Activos de la empresa del empleado; vacío si no está habilitado.
          items:
            type: object
            required: [id, numero, patente, sucursal_id, sucursal_nombre, tiene_inicial]
            properties:
              id: {type: integer}
              numero: {type: string}
              patente: {type: string}
              sucursal_id: {type: integer}
              sucursal_nombre: {type: string}
              tiene_inicial: {type: integer, enum: [0, 1], description: Inicial del camión hoy por cualquier empleado.}
        horarios:
          type: array
          description: Reglas vigentes; priorizar sucursal del camión sobre regla general.
          items:
            type: object
            required: [id, nombre, tipo, sucursal_id, desde_minuto, hasta_minuto]
            properties:
              id: {type: integer}
              nombre: {type: string}
              tipo: {type: string, enum: [inicial, recarga]}
              sucursal_id: {type: integer, nullable: true, description: null significa regla general de empresa.}
              desde_minuto: {type: integer, minimum: 0, maximum: 1439, description: Inicio inclusive.}
              hasta_minuto: {type: integer, minimum: 1, maximum: 1440, description: Fin exclusivo; 1440 es fin del día.}
    CargaInput:
      type: object
      required: [camion_id, tipo, consolidado, valida, envio_id]
      properties:
        camion_id: {type: integer, minimum: 1}
        tipo: {type: string, enum: [inicial, recarga]}
        consolidado: {type: string, minLength: 1, maxLength: 64, example: '000123', description: Preservar ceros iniciales; se recorta y normaliza a mayúsculas.}
        valida: {type: boolean, description: Selección explícita; no omitir ni preseleccionar.}
        observaciones: {type: string, maxLength: 2000, description: Obligatorio si valida es false.}
        envio_id: {type: string, format: uuid, description: Conservar en reintentos con el mismo contenido.}
        origen: {type: string, enum: [web, app], default: app}
      example:
        camion_id: 7
        tipo: inicial
        consolidado: '000123'
        valida: true
        observaciones: ''
        envio_id: 08271a75-ff73-479e-9304-5e9f949330f7
        origen: web
    CargaRegistro:
      type: object
      description: Valores históricos. Alta/detalle incluyen fotos; listado incluye fotos_cantidad. Campos adicionales deben tolerarse.
      required: [id, empresa_id, empleado_id, legajo, empleado_nombre, sucursal_empleado_id, sucursal_empleado_nombre, puesto_nombre, camion_id, camion_numero, camion_patente, sucursal_camion_id, sucursal_camion_nombre, fecha, registrado_at, tipo, consolidado, valida, observaciones, en_horario, horario_id, horario_nombre, desde_minuto, hasta_minuto, origen]
      properties:
        id: {type: integer}
        empresa_id: {type: integer}
        empleado_id: {type: integer}
        legajo: {type: string}
        empleado_nombre: {type: string}
        sucursal_empleado_id: {type: integer}
        sucursal_empleado_nombre: {type: string}
        puesto_nombre: {type: string}
        camion_id: {type: integer}
        camion_numero: {type: string}
        camion_patente: {type: string}
        sucursal_camion_id: {type: integer}
        sucursal_camion_nombre: {type: string}
        fecha: {type: string, format: date}
        inicial_fecha: {type: string, format: date, nullable: true, readOnly: true, description: Propiedad calculada; fecha para inicial y null para recarga. Usar fecha y tipo en el cliente.}
        registrado_at: {type: string, format: date-time, example: '2026-09-29T07:58:21-03:00'}
        tipo: {type: string, enum: [inicial, recarga]}
        consolidado: {type: string}
        valida: {type: integer, enum: [0, 1]}
        en_horario: {type: integer, enum: [0, 1], description: Independiente de valida. Un alta fuera de horario también devuelve 201.}
        observaciones: {type: string}
        horario_id: {type: integer}
        horario_nombre: {type: string}
        desde_minuto: {type: integer}
        hasta_minuto: {type: integer}
        origen: {type: string, enum: [web, app]}
        fotos_cantidad: {type: integer, description: Presente en listado.}
        fotos:
          type: array
          description: Presente en detalle y alta.
          items:
            type: object
            required: [id]
            properties:
              id: {type: integer}
    TriviaResultadoPersonal:
      type: object
      description: Puntaje personal conservado incluso cuando no participa en rankings.
      properties:
        fuera_ranking:
          type: boolean
          default: false
          description: Excluye solo esta trivia del ranking, ganador y acumulado anual.
        puntos_total:
          type: integer
          nullable: true
        posicion:
          type: integer
          nullable: true
          description: Sin posicion cuando fuera_ranking es true.
        es_ganador:
          type: boolean
          default: false
        trivia_id:
          type: integer
        estado_resultado:
          type: string
        correctas:
          type: integer
        incorrectas:
          type: integer
        tiempo_total_segundos:
          type: integer
          nullable: true
        total_preguntas:
          type: integer
        siguiente_trivia_disponible:
          type: boolean

    # --- Auth ---
    LoginRequest:
      type: object
      required:
      - dni
      - password
      properties:
        dni:
          type: string
          example: '30111222'
        password:
          type: string
          example: secreta123
        platform:
          type: string
          description: Plataforma del cliente; android o ios. Opcional.
        device_model:
          type: string
        app_version:
          type: string

    EmpleadoBasico:
      type: object
      properties:
        id:
          type: integer
        dni:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        empresa_id:
          type: integer
        foto:
          type: string
          nullable: true
        imagen_version:
          type: string
          nullable: true

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        empleado:
          $ref: '#/components/schemas/EmpleadoBasico'

    # --- Asistencia ---
    AsistenciaItem:
