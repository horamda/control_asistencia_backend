security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /reintegros/odometro/{fid}:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1odometro~1{fid}'
  /reintegros/recordatorios:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1recordatorios'
  /reintegros/recordatorios/{rid}/leido:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1recordatorios~1{rid}~1leido'
  /reintegros/config:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1config'
  /reintegros/solicitudes:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1solicitudes'
  /reintegros/solicitudes/{rid}:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1solicitudes~1{rid}'
  /reintegros/solicitudes/{rid}/acciones:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1solicitudes~1{rid}~1acciones'
  /reintegros/fotos/{fid}:
    $ref: './reintegros_mobile_openapi.yaml#/paths/~1reintegros~1fotos~1{fid}'
  /seguridad/config:
    get:
      tags: [SeguridadHigiene]
      summary: Catálogos activos y personas elegibles de la sucursal
      responses:
        '200':
          description: 'Tipos, empleados, externos [{id, nombre, empresa, activo}], catalogos, fecha_actual, max_fotos y max_foto_bytes; agrega dashboard {version_contrato, historial_propio, indicadores, ranking_alcances, sucursal_id}. Ver seguridad_mobile_dashboard.md.'
        '401':
          description: Sesión inválida
  /seguridad/eventos:
    get:
      tags: [SeguridadHigiene]
      summary: Historial propio aprobado o reportes enviados
      parameters:
        - {in: query, name: vista, schema: {type: string, enum: [propio, enviados], default: propio}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: tipo, schema: {type: string, enum: [seguro, inseguro, incidente, accidente]}}
        - {in: query, name: estado, schema: {type: string, enum: [pendiente, aprobado, rechazado, anulado]}}
        - {in: query, name: desde, schema: {type: string, format: date}}
        - {in: query, name: hasta, schema: {type: string, format: date}}
      responses:
        '200':
          description: items, total, page y per_page (30); filtros nunca amplían alcance autorizado.
        '400':
          description: Filtro inválido
        '401':
          description: Sesión inválida
    post:
      tags: [SeguridadHigiene]
      summary: Reportar un evento pendiente con varias personas y fotos opcionales
      requestBody:
        required: true
        content:
          application/json:
            schema: &SeguridadAlta
              type: object
              required: [envio_id, tipo, fecha_evento, descripcion]
              description: Entre 1 y 100 personas sumando involucrados y externos. Empleados de la sucursal del reportante; externos de la misma empresa.
              anyOf:
                - required: [involucrados]
                  properties:
                    involucrados: {minItems: 1}
                - required: [externos]
                  properties:
                    externos: {minItems: 1}
              properties:
                envio_id: {type: string, format: uuid}
                tipo: {type: string, enum: [seguro, inseguro, incidente, accidente]}
                fecha_evento: {type: string, format: date}
                involucrados: {type: array, minItems: 0, maxItems: 100, items: {type: integer}}
                externos:
                  type: array
                  maxItems: 100
                  description: 'Admite varios externos registrados y nuevos juntos. Máximo 100 personas sumando involucrados y externos. No repetir IDs ni nuevos con el mismo nombre y empresa. Los homónimos no se fusionan automáticamente.'
                  example: [{id: 7}, {id: 12}, {nombre: 'Visitante nuevo', empresa: 'Proveedor'}]
                  items:
                    oneOf:
                      - type: object
                        required: [id]
                        properties:
                          id: {type: integer, minimum: 1, description: ID de un externo activo de config.externos}
                      - type: object
                        required: [nombre]
                        properties:
                          nombre: {type: string, minLength: 1, maxLength: 180}
                          empresa: {type: string, maxLength: 180, description: Empresa o procedencia opcional}
                categoria_id: {type: integer, description: Obligatorio en seguro e inseguro}
                descripcion: {type: string, maxLength: 8000}
                advertido: {type: string, enum: ['si', 'no'], description: Obligatorio en inseguro}
                hora_evento: {type: string, description: 'HH:MM; obligatorio en accidente/incidente'}
                lugar: {type: string, maxLength: 180, description: Obligatorio en accidente/incidente}
                clasificacion: {type: string, maxLength: 180}
                atencion: {type: string, maxLength: 180}
                lesion: {type: string, maxLength: 180}
                parte_cuerpo: {type: string, maxLength: 180}
          multipart/form-data:
            schema:
              type: object
              required: [envio_id, tipo, fecha_evento, descripcion]
              properties:
                envio_id: {type: string, format: uuid}
                tipo: {type: string, enum: [seguro, inseguro, incidente, accidente]}
                fecha_evento: {type: string, format: date}
                involucrados: {type: string, description: 'Array JSON serializado, ej. [10,11]'}
                externos: {type: string, example: '[{"id":7},{"id":12},{"nombre":"Visitante nuevo","empresa":"Proveedor"}]', description: 'Lista completa en un único campo JSON serializado. Admite varios registrados y nuevos juntos. Nombre obligatorio para nuevos; empresa opcional. Máximo 100 personas sumando empleados y externos. No enviar externos_id ni IDs separados por comas.'}
                categoria_id: {type: integer}
                descripcion: {type: string, maxLength: 8000}
                advertido: {type: string, enum: ['si', 'no']}
                hora_evento: {type: string}
                lugar: {type: string, maxLength: 180}
                fotos: {type: array, maxItems: 5, items: {type: string, format: binary}, description: JPG/PNG/WEBP hasta 5 MiB cada una}
      responses:
        '201':
          description: Creado pendiente
          content:
            application/json:
              schema: &SeguridadCreado
                type: object
                properties:
                  id: {type: integer}
                  estado: {type: string}
                  repetido: {type: boolean}
        '200':
          description: Reintento idéntico, mismo ID; consultar detalle para estado actual
          content:
            application/json:
              schema: *SeguridadCreado
        '400': {description: Datos inválidos}
        '401': {description: Sesión inválida}
        '403': {description: Personas fuera de alcance}
        '409': {description: Clave de envío usada con otro contenido}
        '413': {description: Tamaño excedido}
  /seguridad/eventos/{id}:
    get:
      tags: [SeguridadHigiene]
      summary: Detalle propio o enviado; oculta identidad del reportante y notas administrativas
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      responses:
        '200': {description: 'Evento con detalles, involucrados visibles y fotos (IDs)'}
        '401': {description: Sesión inválida}
        '404': {description: Inexistente o no autorizado}
  /seguridad/fotos/{id}:
    get:
      tags: [SeguridadHigiene]
      summary: Foto privada del evento autorizado
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      responses:
        '200':
          description: JPEG sin EXIF; Cache-Control private, no-store
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '401': {description: Sesión inválida}
        '404': {description: Inexistente o no autorizado}
  /seguridad/resumen:
    get:
      tags: [SeguridadHigiene]
      summary: Resumen del empleado autenticado por tipo, series e indicadores
      description: Solo eventos propios aprobados. Comparativo anual de todo su historial hasta hoy; mes filtra tarjetas, no series. Sin IDs seleccionables de otros empleados.
      parameters:
        - {in: query, name: anio, schema: {type: integer, minimum: 2000}, description: Año actual por defecto; no puede ser futuro}
        - {in: query, name: mes, schema: {type: integer, minimum: 1, maximum: 12}, description: Omitir para año completo}
      responses:
        '200':
          description: Resumen propio; indicadores con corte a hoy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeguridadResumen'}
        '400': {description: Año o mes inválido}
        '401': {description: Sesión inválida o empleado inactivo}
  /seguridad/indicadores:
    get:
      tags: [SeguridadHigiene]
      summary: Días sin accidentes de empresa, sucursal actual y propio empleado
      description: Agregados sin nombres ni detalles de compañeros. Días desde el último accidente pendiente o aprobado, por fecha del evento y alcance. No requiere inicio configurado si hay accidente. Sin accidente usa inicio confiable; sin ambos devuelve null. El récord requiere inicio confiable. La sucursal proviene del empleado autenticado.
      parameters:
        - {in: query, name: hasta, schema: {type: string, format: date}, description: Hoy por defecto; desde 2000 y no futura}
      responses:
        '200':
          description: Indicadores y disponibilidad por alcance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeguridadIndicadores'}
        '400': {description: Corte inválido}
        '401': {description: Sesión inválida o empleado inactivo}
  /seguridad/ranking:
    get:
      tags: [SeguridadHigiene]
      summary: Rankings seguro e inseguro separados de la empresa; fecha del evento
      parameters:
        - {in: query, name: alcance, schema: {type: string, enum: [empresa, sucursal], default: empresa}, description: Sucursal actual del empleado; 400 si no tiene asignada}
        - {in: query, name: anio, schema: {type: integer, minimum: 2000, maximum: 2100}}
        - {in: query, name: mes, schema: {type: integer, minimum: 1, maximum: 12}, description: Omitir para año completo}
      responses:
        '200':
          description: Rankings separados y posicion propia; externos vacios en alcance sucursal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeguridadRanking'}
        '400': {description: Período inválido}
        '401': {description: Sesión inválida}
  /cargas/config:
    get:
      tags: [ValidacionCarga]
      summary: Habilitación de reparto, camiones y horarios vigentes
      responses:
        '200':
          description: Configuración; flags booleanos y horarios en minutos desde medianoche.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaConfig'}
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
  /cargas:
    get:
      tags: [ValidacionCarga]
      summary: Historial propio de validaciones
      description: Solo page; 30 registros por pagina, sin filtros adicionales. Orden fecha/hora e ID descendente.
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: Página de hasta 30 registros
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CargaRegistro'}
                  total: {type: integer}
                  page: {type: integer}
                  per_page: {type: integer}
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
    post:
      tags: [ValidacionCarga]
      summary: Registrar carga inicial o recarga por un chofer o ayudante habilitado
      description: Una inicial por camion/dia y un consolidado por camion/dia. Recarga requiere inicial previa. Conservar envio_id y payload en reintentos; fechas e identidad las asigna el servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CargaInput'}
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/CargaInput'}
                - type: object
                  properties:
                    fotos:
                      type: array
                      maxItems: 5
                      description: Campo fotos repetido; JPG/PNG/WEBP, hasta 5242880 bytes por archivo y 20 megapixeles; maximo total 28311552 bytes.
                      items: {type: string, format: binary}
      responses:
        '201':
          description: Registro creado, con fotos atómicas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaAltaResponse'}
        '200':
          description: Reintento idéntico; registro original y repetido true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaAltaResponse'}
        '400':
          description: Datos o imágenes inválidos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '403':
          description: Puesto no habilitado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '404':
          description: Camión inexistente o de otra empresa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '409':
          description: Duplicado o configuración/estado incompatible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '413':
          description: Supera 27 MB totales
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
  /cargas/{id}:
    get:
      tags: [ValidacionCarga]
      summary: Detalle propio y fotos
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Datos históricos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaRegistro'}
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '404':
          description: Inexistente o ajeno
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
  /cargas/fotos/{id}:
    get:
      tags: [ValidacionCarga]
      summary: Foto privada con autorización del empleado
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Foto JPEG, Cache-Control private no-store
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}
        '404':
          description: Inexistente o ajena
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CargaError'}

  # ---- Auth ----
  /auth/login:
    post:
      tags: [Auth]
      summary: Login con DNI y password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT + datos del empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el token JWT
      responses:
        '200':
          description: Nuevo token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  # ---- Perfil ----
  /me:
    get:
      tags: [Perfil]
      summary: Perfil del empleado autenticado
      responses:
        '200':
          description: Datos del empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoBasico'

  /me/config-asistencia:
    get:
      tags: [Perfil]
      summary: Configuracion de asistencia de la empresa
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa_id:
                    type: integer
                  requiere_qr:
                    type: boolean
                  requiere_foto:
                    type: boolean
                  requiere_geo:
                    type: boolean
                  tolerancia_global:
                    type: integer
                  cooldown_scan_segundos:
                    type: integer
                  intervalo_minimo_fichadas_minutos:
                    type: integer
                  metodos_habilitados:
                    type: array
                    items:
                      type: string

  /me/perfil:
    put:
      tags: [Perfil]
      summary: Actualiza perfil (JSON o multipart)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                telefono:
                  type: string
                  nullable: true
                direccion:
                  type: string
                  nullable: true
                foto:
                  type: string
                  nullable: true
                eliminar_foto:
                  type: boolean
          multipart/form-data:
            schema:
              type: object
              properties:
                telefono:
                  type: string
                direccion:
                  type: string
                foto:
                  type: string
                foto_file:
                  type: string
                  format: binary
                eliminar_foto:
                  type: string
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  telefono:
                    type: string
                    nullable: true
                  direccion:
                    type: string
                    nullable: true
                  foto:
                    type: string
                    nullable: true
                  imagen_version:
                    type: string
                    nullable: true
        '400':
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/perfil/foto:
    delete:
      tags: [Perfil]
      summary: Elimina la foto de perfil
      responses:
        '200':
          description: Foto eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  foto:
                    type: string
                    nullable: true
                  imagen_version:
                    type: string
                    nullable: true

  /me/password:
    put:
      tags: [Perfil]
      summary: Cambia la password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual:
                  type: string
                password_nueva:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Password actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---- Fichadas ----
  /me/qr:
    post:
      tags: [Fichadas]
      summary: Genera un QR de fichada
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accion:
                  type: string
                  enum: [ingreso, egreso, auto]
                  default: auto
                scope:
                  type: string
                  enum: [empresa, empleado]
                  default: empresa
                tipo_marca:
                  type: string
                  enum: [jornada, desayuno, almuerzo, merienda, otro]
                  default: jornada
                vigencia_segundos:
                  type: integer
                  minimum: 30
                  maximum: 315360000
                  default: 2592000
      responses:
        '200':
          description: QR generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accion:
                    type: string
                  scope:
                    type: string
                  tipo_marca:
                    type: string
                  empresa_id:
                    type: integer
                  empleado_id:
                    type: integer
                    nullable: true
                  vigencia_segundos:
                    type: integer
                  expira_at:
                    type: string
                    format: date-time
                  qr_token:
                    type: string
                  qr_png_base64:
                    type: string

  /me/fichadas/scan:
    post:
      tags: [Fichadas]
      summary: Fichada via QR (ingreso/egreso automatico) â€” recomendado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, lat, lon]
              properties:
                qr_token:
                  type: string
                  description: JWT QR directo, Bearer JWT, URL con qr_token/token o JSON con qr_token.
                fecha:
                  type: string
                  format: date
                hora:
                  type: string
                  example: "08:03"
                tipo_marca:
                  type: string
                  enum: [jornada, desayuno, almuerzo, merienda, otro]
                lat:
                  type: number
                  example: -34.6037
                lon:
                  type: number
                  example: -58.3816
      responses:
        '201':
          description: Ingreso registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  marca_id:
                    type: integer
                  accion:
                    type: string
                    example: ingreso
                  tipo_marca:
                    type: string
                  estado:
                    type: string
                  gps_ok:
                    type: boolean
                  distancia_m:
                    type: number
                  tolerancia_m:
                    type: number
                  alerta_fraude:
                    type: boolean
                  evento_id:
                    type: integer
                    nullable: true
                  total_marcas_dia:
                    type: integer
        '200':
          description: Egreso registrado (mismo esquema con accion=egreso)
        '400':
          description: QR invalido, vencido o de otro ambiente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - qr_token_required
                      - qr_token_malformed
                      - qr_token_invalid
                      - qr_token_invalid_signature
                      - qr_token_expired
                      - qr_token_wrong_type
                      - qr_token_missing_empresa
                      - qr_token_wrong_action
                      - qr_not_registered
                      - qr_inactive
                      - qr_wrong_empresa
                      - qr_wrong_empleado
                    example: qr_token_invalid_signature
        '403':
          description: Fuera de geocerca
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  gps_ok:
                    type: boolean
                  distancia_m:
                    type: number
                  tolerancia_m:
                    type: number
                  alerta_fraude:
                    type: boolean
                  evento_id:
                    type: integer
        '409':
          description: Cooldown (doble scan) o conflicto de jornada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    example: scan_cooldown
                  cooldown_segundos_restantes:
                    type: integer
                    nullable: true

  /me/fichadas/entrada:
    post:
      tags: [Fichadas]
      deprecated: true
      summary: Registra entrada (deprecated â€” usar /scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Entrada registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  estado:
                    type: string

  /me/fichadas/salida:
    post:
      tags: [Fichadas]
      deprecated: true
      summary: Registra salida (deprecated â€” usar /scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Salida registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  estado:
                    type: string

  # ---- Asistencias ----
  /me/horario-esperado:
    get:
      tags: [Asistencias]
      summary: Horario esperado para una fecha
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Horario esperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiene_excepcion:
                    type: boolean
                  bloques:
                    type: array
                    items:
                      type: object
                      properties:
                        entrada:
                          type: string
                        salida:
                          type: string
                  tolerancia:
                    type: integer
        '404':
          description: Sin horario esperado

  /me/asistencias:
    get:
      tags: [Asistencias]
      summary: Lista paginada de asistencias
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de asistencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAsistencias'

  /me/marcas:
    get:
      tags: [Asistencias]
      summary: Lista paginada de marcas atomicas (ingreso/egreso)
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Marcas reales y resumenes historicos; actualizar la consulta despues de una correccion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Positivo para marcas reales; negativo estable para movimientos virtuales de solo lectura.
                        asistencia_id:
                          type: integer
                          nullable: true
                        corregida_manualmente:
                          type: boolean
                          default: false
                        es_resumen:
                          type: boolean
                          default: false
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer

  # ---- Estadisticas ----
  /me/estadisticas:
    get:
      tags: [Estadisticas]
      summary: KPIs agregados del empleado para un rango
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
          description: "Default: hoy - 29 dias"
        - name: hasta
          in: query
          schema:
            type: string
            format: date
          description: "Default: hoy. Sin fechas futuras. Max 366 dias."
      responses:
        '200':
          description: Estadisticas completas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasResponse'
        '400':
          description: Fechas invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/dashboard:
    get:
      tags: [Estadisticas]
      summary: Dashboard consolidado para pantalla principal
      description: |
        Combina en una sola llamada:
        - Estadisticas de asistencia (KPIs, series diaria y semanal)
        - Resumen de legajo (historico, periodo, por tipo/severidad, recientes)
        - Vacaciones activas o futuras (desde hoy)
        - Francos proximos 30 dias
        - Horario actual asignado con dias de la semana
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [7d, 30d, mes_actual, 90d]
            default: 30d
          description: "Preset de rango. Ignorado si se envian desde/hasta."
        - name: desde
          in: query
          schema:
            type: string
            format: date
          description: "Override custom (ISO date)"
        - name: hasta
          in: query
          schema:
            type: string
            format: date
          description: "Override custom (ISO date). Sin fechas futuras. Max 366 dias."
      responses:
        '200':
          description: Dashboard completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Rango invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---- Justificaciones ----
  /me/justificaciones:
    get:
      tags: [Justificaciones]
      summary: Lista paginada de justificaciones del empleado
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, aprobada, rechazada]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de justificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJustificaciones'
    post:
      tags: [Justificaciones]
      summary: Crea una justificacion (estado inicial siempre pendiente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustificacionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JustificacionCreateMultipartRequest'
      responses:
        '201':
          description: Justificacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '400':
          description: Validacion fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/justificaciones/{id}:
    get:
      tags: [Justificaciones]
      summary: Detalle de una justificacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Justificacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Justificaciones]
      summary: Edita una justificacion (solo si esta pendiente)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustificacionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JustificacionUpdateMultipartRequest'
      responses:
        '200':
          description: Justificacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '404':
          description: No encontrada
        '409':
          description: No esta en estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Justificaciones]
      summary: Retira una justificacion (solo si esta pendiente)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          description: No encontrada
        '409':
          description: No esta en estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/justificaciones/{id}/adjuntos:
    get:
      tags: [Justificaciones]
      summary: Lista los adjuntos de una justificacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de adjuntos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionAdjuntosListResponse'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/justificaciones/{id}/marcar-vista:
    post:
      tags: [Justificaciones]
      summary: Marca como vista una justificacion resuelta
      description: Usar cuando Flutter muestra al empleado una justificacion aprobada o rechazada. Solo aplica si la justificacion ya no esta pendiente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Justificacion marcada como vista
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  justificacion:
                    $ref: '#/components/schemas/JustificacionItem'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La justificacion aun esta pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/justificaciones/{id}/adjuntos/{adjunto_id}:
    get:
      tags: [Justificaciones]
      summary: Descarga un adjunto de una justificacion del empleado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adjunto_id
          in: path
          required: true
          schema:
            type: integer
        - name: download
          in: query
          schema:
            type: boolean
          description: Si es true, fuerza descarga como attachment.
      responses:
        '200':
          description: Archivo adjunto
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Adjunto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Justificaciones]
      summary: Elimina un adjunto de una justificacion pendiente
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - name: adjunto_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Adjunto eliminado
        '404':
          description: Justificacion o adjunto no encontrado
        '409':
          description: La justificacion ya no esta pendiente

  # ---- Vacaciones ----
  /vacaciones/resumen:
    get:
      tags: [Vacaciones]
      summary: Resumen de saldo de vacaciones LCT
      description: Calcula dias base, ajustes, tomados, pendientes y saldo disponible para el empleado autenticado.
      parameters:
        - name: anio
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
          description: Anio a consultar. Si se omite, usa el anio actual del servidor.
      responses:
        '200':
          description: Resumen de vacaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacacionesResumenResponse'
        '400':
          description: Anio invalido o empleado sin datos validos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkErrorResponse'

  /vacaciones/movimientos:
    get:
      tags: [Vacaciones]
      summary: Movimientos de vacaciones por anio
      description: Lista movimientos `tomado`, `compensatorio` y `ajuste` del empleado autenticado.
      parameters:
        - name: anio
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
          description: Anio a consultar. Si se omite, usa el anio actual del servidor.
      responses:
        '200':
          description: Movimientos de vacaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacacionesMovimientosResponse'
        '400':
          description: Anio invalido o empleado sin datos validos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkErrorResponse'

  /vacaciones/solicitar:
    post:
      tags: [Vacaciones]
      summary: Solicita vacaciones con validacion de saldo
      description: Crea un movimiento `tomado` en estado `pendiente` si hay saldo disponible.
      requestBody:
        required: true
        content:
          application/json:
