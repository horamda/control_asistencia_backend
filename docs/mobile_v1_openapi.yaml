      - url: http://localhost:5000
        description: Local root
      - url: https://control-asistencia.up.railway.app
        description: Produccion root
    get:
      tags: [Feedback]
      summary: Historial del sector origen del empleado autenticado
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, resuelto, vencido]
          required: false
        - name: q
          in: query
          schema:
            type: string
          description: "Misma logica que historial: cliente, motivo, descripcion, resolucion, estado o nombres/legajos de participantes. Admite varias palabras."
          required: false
      responses:
        '200':
          description: Feedbacks originados en el sector del empleado autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '401':
          description: Token invalido o empleado inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

