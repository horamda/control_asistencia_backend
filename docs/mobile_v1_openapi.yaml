    get:
      summary: Version minima y recomendada por plataforma
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResponse'
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          type: string
          default: android
        description: android o ios; ausente o invalido usa android.
      security: []
  /calificar-app:
    post:
      summary: Calificar la app una vez por empleado y version
      responses:
        '201':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
        '401':
          description: JWT ausente, invalido o empleado inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Puntuacion ausente o fuera de 1 a 5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya califico esta version de la app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalificarAppRequest'
      description: 'version_app omitida o nula permite una sola calificacion con version nula. comentario:
