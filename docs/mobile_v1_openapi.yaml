            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Empleado, trivia o recurso no encontrado/no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Respuestas o participacion invalidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Respuestas ya enviadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Trivia ya finalizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trivia_id:
                  type: integer
                respuestas:
                  type: array
                  items:
                    type: object
                    properties:
                      pregunta_id:
                        type: integer
                      respuesta:
                        type: string
                        enum:
                        - A
                        - B
                        - C
                        - D
                      tiempo_respuesta_segundos:
                        type: integer
                    required:
                    - pregunta_id
                    - respuesta
              required:
              - trivia_id
              - respuestas
      description: Preguntas omitidas cuentan como incorrectas. fuera_ranking conserva puntaje personal
        y excluye esta trivia de rankings y ganadores.
      tags:
      - Trivia
