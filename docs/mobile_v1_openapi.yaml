openapi: 3.0.3
info:
  title: FichaYa - Mobile API v1
  version: 1.25.0
  description: |
    API REST para la aplicacion Flutter de control de asistencia.
    Todos los endpoints (excepto auth) requieren header `Authorization: Bearer <token>`.
    Los modulos complementarios Feedback (`/api/v1/feedback`) y SKAP (`/api/skap`)
    usan el mismo Bearer JWT mobile, aunque no cuelgan del prefijo `/api/v1/mobile`.
    La campana de Alertas del home agrupa adelantos, pedidos de mercaderia y feedback
    para mostrar novedades o aprobaciones pendientes sin cambiar los flujos existentes.
  contact:
    name: Equipo Backend
servers:
  - url: http://localhost:5000/api/v1/mobile
    description: Local
  - url: https://control-asistencia-backend-8gle.onrender.com/api/v1/mobile
    description: Produccion

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- Auth ---
    LoginRequest:
      type: object
      required: [dni, password]
      properties:
        dni:
          type: string
          example: "30111222"
        password:
          type: string
          example: "secreta123"

    EmpleadoBasico:
      type: object
      properties:
        id:
          type: integer
        dni:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        empresa_id:
          type: integer
        foto:
          type: string
          nullable: true
        imagen_version:
          type: string
          nullable: true

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        empleado:
          $ref: '#/components/schemas/EmpleadoBasico'

    # --- Asistencia ---
    AsistenciaItem:
      type: object
      properties:
        id:
          type: integer
        fecha:
          type: string
          format: date
        hora_entrada:
          type: string
          nullable: true
          example: "08:01"
        hora_salida:
          type: string
          nullable: true
          example: "16:04"
        metodo_entrada:
          type: string
          nullable: true
        metodo_salida:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
          enum: [ok, tarde, ausente, salida_anticipada]
        observaciones:
          type: string
          nullable: true
        gps_ok_entrada:
          type: boolean
          nullable: true
        gps_ok_salida:
          type: boolean
          nullable: true
        gps_distancia_entrada_m:
          type: number
          nullable: true
        gps_distancia_salida_m:
          type: number
          nullable: true
        gps_tolerancia_entrada_m:
          type: number
          nullable: true
        gps_tolerancia_salida_m:
          type: number
          nullable: true

    PaginatedAsistencias:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AsistenciaItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    # --- Estadisticas ---
    EstadisticasKpis:
      type: object
      properties:
        puntualidad_pct:
          type: number
          description: "% de registros con estado ok"
        ausentismo_pct:
          type: number
        cumplimiento_jornada_pct:
          type: number
          description: "% de jornadas con entrada y salida"
        no_show_pct:
          type: number
          description: "% de ausencias sin justificacion aprobada"
        tasa_salida_anticipada_pct:
          type: number
        adherencia_pct:
          type: number
          description: "% de dias laborables con al menos una marca"
        horas_promedio:
          type: number
          description: "Horas promedio por jornada completa"
        horas_totales:
          type: number
          description: "Horas trabajadas totales en el periodo"
        gps_incidencias:
          type: integer
          description: "Cantidad de marcas con GPS rechazado"
        dias_laborables:
          type: integer
          description: "Dias habiles (lun-vie) en el rango"
        dias_con_registro:
          type: integer
        racha_ok:
          type: integer
          description: "Dias consecutivos con estado ok desde hoy hacia atras"

    EstadisticasResponse:
      type: object
      properties:
        periodo:
          type: object
          properties:
            desde:
              type: string
              format: date
            hasta:
              type: string
              format: date
            dias:
              type: integer
        totales:
          type: object
          properties:
            registros:
              type: integer
            ok:
              type: integer
            tarde:
              type: integer
            ausente:
              type: integer
            salida_anticipada:
              type: integer
            sin_estado:
              type: integer
        kpis:
          $ref: '#/components/schemas/EstadisticasKpis'
        jornadas:
          type: object
          properties:
            completas:
              type: integer
            con_marca:
              type: integer
            incompletas:
              type: integer
        justificaciones:
          type: object
          properties:
            total:
              type: integer
            pendientes:
              type: integer
            aprobadas:
              type: integer
            rechazadas:
              type: integer
            tasa_aprobacion_pct:
              type: number
            tasa_justificacion_pct:
              type: number
              description: "% de ausencias cubiertas con justificacion aprobada"
        vacaciones:
          type: object
          properties:
            eventos:
              type: integer
            dias:
              type: integer
        ausencias:
          type: object
          properties:
            total:
              type: integer
            sin_justificacion:
              type: integer
        series:
          type: object
          properties:
            diaria:
              type: array
              items:
                type: object
                properties:
                  fecha:
                    type: string
                    format: date
                  registros:
                    type: integer
                  ok:
                    type: integer
                  tarde:
                    type: integer
                  ausente:
                    type: integer
                  salida_anticipada:
                    type: integer
                  puntualidad_pct:
                    type: number
                  ausentismo_pct:
                    type: number
            semanal:
              type: array
              items:
                type: object
                properties:
                  desde:
                    type: string
                    format: date
                  hasta:
                    type: string
                    format: date
                  registros:
                    type: integer
                  ok:
                    type: integer
                  tarde:
                    type: integer
                  ausente:
                    type: integer
                  salida_anticipada:
                    type: integer
                  puntualidad_pct:
                    type: number

    # --- Justificacion ---
    JustificacionItem:
      type: object
      properties:
        id:
          type: integer
        asistencia_id:
          type: integer
          nullable: true
        asistencia_fecha:
          type: string
          format: date
          nullable: true
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        motivo:
          type: string
        archivo:
          type: string
          nullable: true
        legajo_evento_id:
          type: integer
          nullable: true
        adjuntos_count:
          type: integer
          default: 0
        adjuntos_max:
          type: integer
          example: 10
        adjuntos_disponibles:
          type: integer
        adjuntos:
          type: array
          items:
            $ref: '#/components/schemas/JustificacionAdjuntoItem'
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
          default: pendiente
        resuelto_at:
          type: string
          format: date-time
          nullable: true
        resuelto_by_usuario_id:
          type: integer
          nullable: true
        resuelto_by_usuario:
          type: string
          nullable: true
        comentario_resolucion:
          type: string
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        notificado_empleado_at:
          type: string
          format: date-time
          nullable: true
        visto_por_empleado_at:
          type: string
          format: date-time
          nullable: true
        tiene_novedad:
          type: boolean
        created_at:
          type: string
          format: date-time

    JustificacionAdjuntoItem:
      type: object
      properties:
        id:
          type: integer
        evento_id:
          type: integer
        nombre_original:
          type: string
        mime_type:
          type: string
        extension:
          type: string
          nullable: true
        tamano_bytes:
          type: integer
        estado:
          type: string
        created_at:
          type: string
          format: date-time
        download_url:
          type: string

    JustificacionCreateRequest:
      type: object
      required: [fecha_desde, fecha_hasta, motivo]
      properties:
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        asistencia_id:
          type: integer
          nullable: true
        motivo:
          type: string
          example: "Enfermedad con certificado medico"
        archivo:
          type: string
          nullable: true
          example: "https://.../cert.pdf"

    JustificacionCreateMultipartRequest:
      type: object
      required: [fecha_desde, fecha_hasta, motivo]
      properties:
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        asistencia_id:
          type: integer
          nullable: true
        motivo:
          type: string
        archivo:
          type: string
          nullable: true
        adjuntos:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary

    JustificacionUpdateRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
        archivo:
          type: string
          nullable: true

    JustificacionUpdateMultipartRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
        archivo:
          type: string
          nullable: true
        adjuntos:
          type: array
          items:
            type: string
            format: binary

    PaginatedJustificaciones:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JustificacionItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    JustificacionAdjuntosListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JustificacionAdjuntoItem'
        total:
          type: integer

    # --- Vacacion ---
    VacacionItem:
      type: object
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
          nullable: true
        observaciones:
          type: string

    VacacionRequest:
      type: object
      required: [fecha_desde, fecha_hasta]
      properties:
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        observaciones:
          type: string
          nullable: true

    PaginatedVacaciones:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VacacionItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    VacacionesEmpleadoResumen:
      type: object
      properties:
        id:
          type: integer
        dni:
          type: string
        nombre:
          type: string

    VacacionesSaldoResumen:
      type: object
      properties:
        fecha_ingreso:
          type: string
          format: date
        antiguedad_al_31_12:
          type: integer
        dias_habiles_anio:
          type: integer
        dias_trabajados_anio:
          type: integer
        calculo_proporcional:
          type: boolean
        dias_base:
          type: number
        dias_compensatorios:
          type: number
        dias_ajustes:
          type: number
        dias_tomados:
          type: number
        dias_pendientes:
          type: number
        dias_corresponden:
          type: number
        dias_disponibles:
          type: number
        dias_disponibles_con_pendientes:
          type: number

    VacacionesResumenResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        anio:
          type: integer
          example: 2026
        empleado:
          $ref: '#/components/schemas/VacacionesEmpleadoResumen'
        vacaciones:
          $ref: '#/components/schemas/VacacionesSaldoResumen'

    VacacionesMovimiento:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum: [tomado, compensatorio, ajuste]
        dias:
          type: number
        fecha_desde:
          type: string
          format: date
          nullable: true
        fecha_hasta:
          type: string
          format: date
          nullable: true
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado]
        observacion:
          type: string
          nullable: true

    VacacionesMovimientosResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        anio:
          type: integer
          example: 2026
        movimientos:
          type: array
          items:
            $ref: '#/components/schemas/VacacionesMovimiento'

    VacacionesSolicitudRequest:
      type: object
      required: [fecha_desde, fecha_hasta]
      properties:
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        observacion:
          type: string
          nullable: true

    VacacionesSolicitud:
      type: object
      properties:
        id:
          type: integer
        dias_solicitados:
          type: integer
        estado:
          type: string
          enum: [pendiente]
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date

    VacacionesSolicitudResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
        solicitud:
          $ref: '#/components/schemas/VacacionesSolicitud'

    OkErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string

    # --- Adelanto ---
    AdelantoItem:
      type: object
      properties:
        id:
          type: integer
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        fecha_solicitud:
          type: string
          format: date
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado, cancelado]
          default: pendiente
        created_at:
          type: string
          format: date-time
        resuelto_at:
          type: string
          format: date-time
          nullable: true
        resuelto_by_usuario:
          type: string
          nullable: true

    PaginatedAdelantos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdelantoItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    AdelantoEstadoResponse:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        ya_solicitado:
          type: boolean
        adelanto:
          allOf:
            - $ref: '#/components/schemas/AdelantoItem'
          nullable: true

    AdelantoResumenResponse:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        ya_solicitado:
          type: boolean
        adelanto_mes_actual:
          allOf:
            - $ref: '#/components/schemas/AdelantoItem'
          nullable: true
        ultimo_adelanto:
          allOf:
            - $ref: '#/components/schemas/AdelantoItem'
          nullable: true
        total_historial:
          type: integer
        pendientes_total:
          type: integer

    # --- Pedidos de mercaderia ---
    PedidoMercaderiaLinea:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        articulo_id:
          type: integer
        codigo_articulo:
          type: string
        descripcion:
          type: string
        unidades_por_bulto:
          type: integer
        cantidad_bultos:
          type: integer
          minimum: 0
        cantidad_unidades:
          type: integer
          minimum: 0
          description: Unidades sueltas adicionales a los bultos completos.
        total_unidades:
          type: integer
          minimum: 0
          description: cantidad_bultos * unidades_por_bulto + cantidad_unidades.

    PedidoMercaderiaItem:
      type: object
      properties:
        id:
          type: integer
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        fecha_pedido:
          type: string
          format: date
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado, cancelado]
          default: pendiente
        cantidad_items:
          type: integer
        total_bultos:
          type: integer
        total_unidades:
          type: integer
        motivo_rechazo:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        resuelto_at:
          type: string
          format: date-time
          nullable: true
        resuelto_by_usuario:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PedidoMercaderiaLinea'

    PaginatedPedidosMercaderia:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PedidoMercaderiaItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    PedidoMercaderiaEstadoResponse:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        ya_solicitado:
          type: boolean
        pedido:
          allOf:
            - $ref: '#/components/schemas/PedidoMercaderiaItem'
          nullable: true

    PedidoMercaderiaResumenResponse:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
        periodo_month:
          type: integer
        ya_solicitado:
          type: boolean
        pedido_mes_actual:
          allOf:
            - $ref: '#/components/schemas/PedidoMercaderiaItem'
          nullable: true
        ultimo_pedido:
          allOf:
            - $ref: '#/components/schemas/PedidoMercaderiaItem'
          nullable: true
        ultimo_pedido_aprobado:
          allOf:
            - $ref: '#/components/schemas/PedidoMercaderiaItem'
          nullable: true
        total_historial:
          type: integer
        historial_aprobados_total:
          type: integer
        pendientes_total:
          type: integer

    CatalogoPedidoMercaderiaItem:
      type: object
      properties:
        id:
          type: integer
        codigo_articulo:
          type: string
        descripcion:
          type: string
        unidades_por_bulto:
          type: integer
        bultos_por_pallet:
          type: integer
          nullable: true
        marca:
          type: string
          nullable: true
        familia:
          type: string
          nullable: true
        sabor:
          type: string
          nullable: true
        division:
          type: string
          nullable: true

    PaginatedCatalogoPedidoMercaderia:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogoPedidoMercaderiaItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    PedidoMercaderiaUpsertRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [articulo_id]
            description: Debe indicar al menos un bulto o una unidad; ambos valores pueden combinarse.
            anyOf:
              - required: [cantidad_bultos]
              - required: [cantidad_unidades]
            properties:
              articulo_id:
                type: integer
              cantidad_bultos:
                type: integer
                minimum: 0
                default: 0
              cantidad_unidades:
                type: integer
                minimum: 0
                default: 0
                description: Unidades sueltas adicionales a los bultos completos.

    # --- Horario ---
    AsignacionHorario:
      type: object
      properties:
        id:
          type: integer
        horario_id:
          type: integer
        horario_nombre:
          type: string
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
          nullable: true

    DiaHorario:
      type: object
      properties:
        dia_semana:
          type: integer
          description: "1=Lunes ... 7=Domingo (ISO week day)"

    HorarioActualResponse:
      type: object
      properties:
        asignacion:
          allOf:
            - $ref: '#/components/schemas/AsignacionHorario'
          nullable: true
        dias:
          type: array
          items:
            $ref: '#/components/schemas/DiaHorario'

    # --- Franco ---
    FrancoItem:
      type: object
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        fecha:
          type: string
          format: date
        motivo:
          type: string

    PaginatedFrancos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FrancoItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # --- Legajo evento ---
    LegajoAdjuntoItem:
      type: object
      properties:
        id:
          type: integer
        evento_id:
          type: integer
        nombre_original:
          type: string
        mime_type:
          type: string
          example: application/pdf
        extension:
          type: string
          nullable: true
        tamano_bytes:
          type: integer
        estado:
          type: string
          enum: [activo, eliminado]
        created_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          example: /api/v1/mobile/me/legajo/adjuntos/99

    LegajoEventoItem:
      type: object
      properties:
        id:
          type: integer
        empresa_id:
          type: integer
          nullable: true
        empleado_id:
          type: integer
          nullable: true
        tipo_id:
          type: integer
        tipo_codigo:
          type: string
        tipo_nombre:
          type: string
        fecha_evento:
          type: string
          format: date
          nullable: true
        fecha_desde:
          type: string
          format: date
          nullable: true
        fecha_hasta:
          type: string
          format: date
          nullable: true
        titulo:
          type: string
        descripcion:
          type: string
        estado:
          type: string
          enum: [vigente, anulado]
        severidad:
          type: string
          nullable: true
          enum: [grave, media, leve]
        justificacion_id:
          type: integer
          nullable: true
        adjuntos_count:
          type: integer
        adjuntos:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LegajoAdjuntoItem'
        created_at:
          type: string
