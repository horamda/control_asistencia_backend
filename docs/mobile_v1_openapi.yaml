  /empleados/imagen/{dni}:
    servers:
    - url: http://localhost:5000
    - url: https://control-asistencia.up.railway.app
    get:
      summary: Foto publica de perfil por DNI
      security: []
      description: Alias compatibles. v permite cache busting; ETag depende de la foto
        real.
      parameters:
      - name: dni
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: query
        schema:
          type: string
      - name: If-None-Match
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Imagen de perfil.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: public, max-age=86400
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: Foto sin cambios; sin body.
        '404':
          description: Foto no encontrada.
  /media/empleados/foto/{dni}:
    servers:
    - url: http://localhost:5000
    - url: https://control-asistencia.up.railway.app
