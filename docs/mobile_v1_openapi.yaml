  # ---- SKAP (prefijo complementario) ----
  /api/skap/preguntas:
    servers:
      - url: http://localhost:5000
        description: Local root
      - url: https://control-asistencia.up.railway.app
        description: Produccion root
    get:
      tags: [SKAP]
      summary: Catalogo historico propio
      description: empleado_id, sector_id y puesto_id deben coincidir con el perfil propio; de lo contrario devuelve 403.
      security:
        - BearerAuth: []
      parameters:
        - name: sector_id
          in: query
          schema:
            type: integer
          required: false
        - name: empleado_id
          in: query
          schema:
            type: integer
          required: false
        - name: categoria
          in: query
          schema:
            type: string
            enum: [S, K, A, P]
          required: false
        - name: activo
          in: query
          schema:
            type: string
            default: "1"
          required: false
      responses:
        '200':
          description: Preguntas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkapPreguntasResponse'
        '400':
          description: Sector requerido o invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkapErrorResponse'

  /api/skap/evaluacion:
    servers:
      - url: http://localhost:5000
