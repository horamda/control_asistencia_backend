              nullable: true
              allOf:
                - $ref: '#/components/schemas/SkapEvaluacion'
            categoria_cards:
              type: array
              items:
                $ref: '#/components/schemas/SkapCategoriaCard'
            historial:
              type: array
              items:
                $ref: '#/components/schemas/SkapEvaluacion'
            plan:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SkapPlan'
            ranking:
              type: object
              nullable: true
            badge:
              type: string
              nullable: true

    SkapRankingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            anio:
              type: integer
            posicion:
              type: integer
              nullable: true
            total:
              type: integer
            puntaje:
              type: number
              nullable: true
            nivel:
              type: string
              nullable: true
            badge:
              type: string
              nullable: true

    SkapPlanesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            anio_seleccionado:
              type: integer
              nullable: true
            total:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/SkapPlan'
            current:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SkapPlan'

    SkapPlanActionInput:
      type: object
      required: [accion]
      properties:
        categoria:
          type: string
          enum: [S, K, A, P]
        accion:
          type: string
        responsable_empleado_id:
          type: integer
          nullable: true
        fecha_compromiso:
          type: string
          format: date
          nullable: true
        estado:
          type: string
          enum: [pendiente, en_proceso, completado, cancelado]
        comentarios:
          type: string
          nullable: true

    SkapPlanUpsertRequest:
      type: object
      required: [evaluacion_id]
      properties:
        evaluacion_id:
          type: integer
        acciones:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SkapPlanActionInput'

    SkapPlanUpsertResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            plan:
              $ref: '#/components/schemas/SkapPlan'
        message:
          type: string

    KpisSectorResponse:
      type: object
      properties:
        anio:
          type: integer
          example: 2026
        sector:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            nombre:
              type: string
              nullable: true
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KpiSectorialItem'

    KpiSectorialItem:
      type: object
      properties:
        kpi_id:
          type: integer
        codigo:
          type: string
          example: BULTOS_ENT
        nombre:
          type: string
          example: Bultos entregados
        unidad:
          type: string
          example: bultos
        tipo_acumulacion:
          type: string
          enum: [suma, promedio, ultimo]
        mayor_es_mejor:
          type: boolean
        condicion:
          type: string
          enum: [gte, lte, eq, between]
          description: "gte=â‰¥  lte=â‰¤  eq==  between=rango [valor_min, valor_max]"
        condicion_simbolo:
          type: string
          example: "â‰¥"
        objetivo_anual:
          type: number
          description: "Objetivo simple del sector (0 si condicion=between o sin configurar)"
        valor_min:
          type: number
          nullable: true
          description: "Limite inferior del rango (solo condicion=between)"
        valor_max:
          type: number
          nullable: true
          description: "Limite superior del rango (solo condicion=between)"
        resultado_acumulado:
          type: number
          description: "Acumulado del empleado en el aÃ±o segun tipo_acumulacion"
        progreso_pct:
          type: number
          description: "resultado_acumulado / objetivo_anual * 100 (0 para between)"
        progreso_esperado_pct:
          type: number
          description: "Fraccion del aÃ±o transcurrida * 100 (100 para promedio/ultimo/between)"
        semaforo:
          type: string
          enum: [verde, amarillo, rojo, gris]
          description: |
            gris=sin objetivo, verde=en ritmo, amarillo=levemente fuera, rojo=fuera.
            Para between: verde=dentro del rango, amarillo=dentro del 10% del margen, rojo=fuera.
        recomendacion:
          type: string
          description: "Texto corto para mostrar al empleado"

    KpiSectorUltimoCargado:
      allOf:
        - $ref: '#/components/schemas/KpiSectorialItem'
        - type: object
          properties:
            objetivo_periodo:
              type: number
              nullable: true
              description: "Objetivo esperado para el periodo puntual evaluado"
            resultado:
              type: number
              nullable: true
            valor:
              type: number
              nullable: true
              description: "Alias del resultado puntual cargado"
            fecha_resultado:
              type: string
              format: date
              nullable: true
              description: "Fecha operativa del KPI informada en el CSV"
            cargado_at:
              type: string
              format: date-time
              nullable: true
              description: "Fecha tecnica de insercion o ultima actualizacion"

    KpiSectorMesCerradoItem:
      allOf:
        - $ref: '#/components/schemas/KpiSectorialItem'
        - type: object
          properties:
            objetivo_mes:
              type: number
              nullable: true
            resultado_mes:
              type: number
              nullable: true
            registros:
              type: integer
            fecha_ultimo_resultado:
              type: string
              format: date
              nullable: true

    KpiSectorMesCerrado:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-04"
        periodo_year:
          type: integer
          example: 2026
        periodo_month:
          type: integer
          example: 4
        mes_nombre:
          type: string
          example: Abril
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        cerrado:
          type: boolean
          example: true
        resumen:
          type: object
          properties:
            total:
              type: integer
            verde:
              type: integer
            amarillo:
              type: integer
            rojo:
              type: integer
            gris:
              type: integer
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KpiSectorMesCerradoItem'

    KpisSectorResumenResponse:
      type: object
      properties:
        anio:
          type: integer
          example: 2026
        sector:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            nombre:
              type: string
              nullable: true
        vista_actual:
          type: object
          properties:
            kpis:
              type: array
              items:
                $ref: '#/components/schemas/KpiSectorialItem'
        ultimo_cargado:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/KpiSectorUltimoCargado'
        meses_cerrados:
          type: array
          items:
            $ref: '#/components/schemas/KpiSectorMesCerrado'
        meta:
          type: object
          properties:
            limit_meses:
              type: integer

security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ---- Auth ----
  /auth/login:
    post:
      tags: [Auth]
      summary: Login con DNI y password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT + datos del empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el token JWT
      responses:
        '200':
          description: Nuevo token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  # ---- Perfil ----
  /me:
    get:
      tags: [Perfil]
      summary: Perfil del empleado autenticado
      responses:
        '200':
          description: Datos del empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoBasico'

  /me/config-asistencia:
    get:
      tags: [Perfil]
      summary: Configuracion de asistencia de la empresa
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa_id:
                    type: integer
                  requiere_qr:
                    type: boolean
                  requiere_foto:
                    type: boolean
                  requiere_geo:
                    type: boolean
                  tolerancia_global:
                    type: integer
                  cooldown_scan_segundos:
                    type: integer
                  intervalo_minimo_fichadas_minutos:
                    type: integer
                  metodos_habilitados:
                    type: array
                    items:
                      type: string

  /me/perfil:
    put:
      tags: [Perfil]
      summary: Actualiza perfil (JSON o multipart)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                telefono:
                  type: string
                  nullable: true
                direccion:
                  type: string
                  nullable: true
                foto:
                  type: string
                  nullable: true
                eliminar_foto:
                  type: boolean
          multipart/form-data:
            schema:
              type: object
              properties:
                telefono:
                  type: string
                direccion:
                  type: string
                foto:
                  type: string
                foto_file:
                  type: string
                  format: binary
                eliminar_foto:
                  type: string
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  telefono:
                    type: string
                    nullable: true
                  direccion:
                    type: string
                    nullable: true
                  foto:
                    type: string
                    nullable: true
                  imagen_version:
                    type: string
                    nullable: true
        '400':
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/perfil/foto:
    delete:
      tags: [Perfil]
      summary: Elimina la foto de perfil
      responses:
        '200':
          description: Foto eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  foto:
                    type: string
                    nullable: true
                  imagen_version:
                    type: string
                    nullable: true

  /me/password:
    put:
      tags: [Perfil]
      summary: Cambia la password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual:
                  type: string
                password_nueva:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Password actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---- Fichadas ----
  /me/qr:
    post:
      tags: [Fichadas]
      summary: Genera un QR de fichada
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accion:
                  type: string
                  enum: [ingreso, egreso, auto]
                  default: auto
                scope:
                  type: string
                  enum: [empresa, empleado]
                  default: empresa
                tipo_marca:
                  type: string
                  enum: [jornada, desayuno, almuerzo, merienda, otro]
                  default: jornada
                vigencia_segundos:
                  type: integer
                  minimum: 30
                  maximum: 315360000
                  default: 2592000
      responses:
        '200':
          description: QR generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accion:
                    type: string
                  scope:
                    type: string
                  tipo_marca:
                    type: string
                  empresa_id:
                    type: integer
                  empleado_id:
                    type: integer
                    nullable: true
                  vigencia_segundos:
                    type: integer
                  expira_at:
                    type: string
                    format: date-time
                  qr_token:
                    type: string
                  qr_png_base64:
                    type: string

  /me/fichadas/scan:
    post:
      tags: [Fichadas]
      summary: Fichada via QR (ingreso/egreso automatico) â€” recomendado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, lat, lon]
              properties:
                qr_token:
                  type: string
                  description: JWT QR directo, Bearer JWT, URL con qr_token/token o JSON con qr_token.
                fecha:
                  type: string
                  format: date
                hora:
                  type: string
                  example: "08:03"
                tipo_marca:
                  type: string
                  enum: [jornada, desayuno, almuerzo, merienda, otro]
                lat:
                  type: number
                  example: -34.6037
                lon:
                  type: number
                  example: -58.3816
      responses:
        '201':
          description: Ingreso registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  marca_id:
                    type: integer
                  accion:
                    type: string
                    example: ingreso
                  tipo_marca:
                    type: string
                  estado:
                    type: string
                  gps_ok:
                    type: boolean
                  distancia_m:
                    type: number
                  tolerancia_m:
                    type: number
                  alerta_fraude:
                    type: boolean
                  evento_id:
                    type: integer
                    nullable: true
                  total_marcas_dia:
                    type: integer
        '200':
          description: Egreso registrado (mismo esquema con accion=egreso)
        '400':
          description: QR invalido, vencido o de otro ambiente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - qr_token_required
                      - qr_token_malformed
                      - qr_token_invalid
                      - qr_token_invalid_signature
                      - qr_token_expired
                      - qr_token_wrong_type
                      - qr_token_missing_empresa
                      - qr_token_wrong_action
                      - qr_not_registered
                      - qr_inactive
                      - qr_wrong_empresa
                      - qr_wrong_empleado
                    example: qr_token_invalid_signature
        '403':
          description: Fuera de geocerca
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  gps_ok:
                    type: boolean
                  distancia_m:
                    type: number
                  tolerancia_m:
                    type: number
                  alerta_fraude:
                    type: boolean
                  evento_id:
                    type: integer
        '409':
          description: Cooldown (doble scan) o conflicto de jornada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    example: scan_cooldown
                  cooldown_segundos_restantes:
                    type: integer
                    nullable: true

  /me/fichadas/entrada:
    post:
      tags: [Fichadas]
      deprecated: true
      summary: Registra entrada (deprecated â€” usar /scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Entrada registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  estado:
                    type: string

  /me/fichadas/salida:
    post:
      tags: [Fichadas]
      deprecated: true
      summary: Registra salida (deprecated â€” usar /scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Salida registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  estado:
                    type: string

  # ---- Asistencias ----
  /me/horario-esperado:
    get:
      tags: [Asistencias]
      summary: Horario esperado para una fecha
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Horario esperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiene_excepcion:
                    type: boolean
                  bloques:
                    type: array
                    items:
                      type: object
                      properties:
                        entrada:
                          type: string
                        salida:
                          type: string
                  tolerancia:
                    type: integer
        '404':
          description: Sin horario esperado

  /me/asistencias:
    get:
      tags: [Asistencias]
      summary: Lista paginada de asistencias
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de asistencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAsistencias'

  /me/marcas:
    get:
      tags: [Asistencias]
      summary: Lista paginada de marcas atomicas (ingreso/egreso)
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de marcas

  # ---- Estadisticas ----
  /me/estadisticas:
    get:
      tags: [Estadisticas]
      summary: KPIs agregados del empleado para un rango
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
          description: "Default: hoy - 29 dias"
        - name: hasta
          in: query
          schema:
            type: string
            format: date
          description: "Default: hoy. Sin fechas futuras. Max 366 dias."
      responses:
        '200':
          description: Estadisticas completas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasResponse'
        '400':
          description: Fechas invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/dashboard:
    get:
      tags: [Estadisticas]
      summary: Dashboard consolidado para pantalla principal
      description: |
        Combina en una sola llamada:
        - Estadisticas de asistencia (KPIs, series diaria y semanal)
        - Resumen de legajo (historico, periodo, por tipo/severidad, recientes)
        - Vacaciones activas o futuras (desde hoy)
        - Francos proximos 30 dias
        - Horario actual asignado con dias de la semana
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [7d, 30d, mes_actual, 90d]
            default: 30d
          description: "Preset de rango. Ignorado si se envian desde/hasta."
        - name: desde
          in: query
          schema:
            type: string
            format: date
          description: "Override custom (ISO date)"
        - name: hasta
          in: query
          schema:
            type: string
            format: date
          description: "Override custom (ISO date). Sin fechas futuras. Max 366 dias."
      responses:
        '200':
          description: Dashboard completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Rango invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---- Justificaciones ----
  /me/justificaciones:
    get:
      tags: [Justificaciones]
      summary: Lista paginada de justificaciones del empleado
      parameters:
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, aprobada, rechazada]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de justificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJustificaciones'
    post:
      tags: [Justificaciones]
      summary: Crea una justificacion (estado inicial siempre pendiente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustificacionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JustificacionCreateMultipartRequest'
      responses:
        '201':
          description: Justificacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '400':
          description: Validacion fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/justificaciones/{id}:
    get:
      tags: [Justificaciones]
      summary: Detalle de una justificacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Justificacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Justificaciones]
      summary: Edita una justificacion (solo si esta pendiente)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustificacionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JustificacionUpdateMultipartRequest'
      responses:
        '200':
          description: Justificacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificacionItem'
        '404':
          description: No encontrada
        '409':
          description: No esta en estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Justificaciones]
