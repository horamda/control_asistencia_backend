[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Sin "sleep": dormido no corren las tareas programadas (trivias, reintegros)
# y el primer usuario espera el arranque completo del contenedor.
sleepApplication = false
