# Lint del backend en CI: solo reglas que detectan errores reales (sintaxis,
# nombres indefinidos, definiciones duplicadas), no estilo. F401 queda fuera
# porque los tests hacen monkeypatch sobre nombres importados en las rutas.
target-version = "py312"
extend-exclude = ["venv", "output", "examples"]

[lint]
select = ["E9", "F63", "F7", "F82", "F811"]

[lint.per-file-ignores]
# Los fixtures de pytest importados se redeclaran como parametros.
"tests/**" = ["F811"]
